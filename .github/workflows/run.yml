name: 刷步数

on:
  schedule:
    # 注意:GitHub Actions 的定时表达式一律按 UTC,北京时间 = UTC+8
    # 7 0,3,6,9,12,14 = 北京 08:07 / 11:07 / 14:07 / 17:07 / 20:07 / 22:07
    # 避开整点执行,整点是 GitHub 最拥堵的时段,经常延迟甚至跳过
    # 本文件注释里刻意不出现英文的定时关键词(上游 Random Cron 会按该关键词 grep 取行,)
    - cron: '17 0,3,6,9,12,14 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
